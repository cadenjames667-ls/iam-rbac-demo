<!doctype html>
<html>
<head><title>Audit Log</title></head>
<body>
  <h1>Audit Log</h1>
  <table border="1" cellpadding="6">
    <tr><th>Time (UTC)</th><th>User</th><th>Action</th><th>Resource</th><th>Result</th></tr>
    {% for created_at, username, action, resource, success in entries %}
    <tr style="background-color: {{ 'transparent' if success else '#ffe0e0' }}">
      <td>{{ created_at }}</td>
      <td>{{ username }}</td>
      <td>{{ action }}</td>
      <td>{{ resource or '' }}</td>
      <td>{{ 'success' if success else 'DENIED / FAILED' }}</td>
    </tr>
    {% endfor %}
  </table>
  <p><a href="{{ url_for('dashboard') }}">Back to dashboard</a></p>
</body>
</html>
